project:
  type: book
  output-dir: docs

# Applied to every chapter. linkate collects each chapter's links and lists
# them at the end. Set here rather than per-chapter so they cannot drift.
filters:
  - linkate
  # The chapter overview box. HTML gets it from chapter-overview.scss;
  # this is the LaTeX half, and it is a no-op in every other format.
  - overview-box.lua

book:
  title: "R Best Practices"
  author: "Nicholas Tierney"
  site-url: https://r-best-practices.njtierney.com
  repo-url: https://github.com/njtierney/rbestpractices
  repo-branch: main
  repo-actions: [edit, issue]
  date: "2026-02-17"
  page-footer: "Copyright 2026, Nicholas Tierney"
  page-navigation: true
  search: true
  # PDF disabled 3 Aug 2026. The runner has no Fira Code, so `monofont:
  # "Fira Code"` fails with a fontspec error, and because the PDF is part of
  # the book render it takes the HTML deploy down with it. Restore this line
  # and the pdf: block below once the font is installed in the workflow.
  # downloads: [pdf]
  chapters:
    - "index.qmd"
    - "setup.qmd"
    - "project-organisation.qmd"
    - "code-style-and-readability.qmd"
    - "writing-readable-code.qmd"
  #   - "writing-functions.qmd"
  #   - "writing-a-reprex-getting-unstuck.qmd"
  #   - "putting-it-all-together.qmd"
  # appendices:
  #   - "appendix-speed-of-thought.qmd"
  #   - "appendix-pipes.qmd"
  #   - "appendix-curly-braces.qmd"

format:
  html:
    theme:
      - cosmo
      - measured/_measured-palette.scss    # Dark2 colours
      - measured/_measured-structure.scss  # code blocks, callout shape
      - measured/_measured-house.scss      # what each callout type means
      - measured/measured-legible.scss     # Atkinson Hyperlegible + Fira Code
      - book-grid.scss                     # book column is narrower than a website
      - chapter-overview.scss              # the box each chapter opens with
    code-copy: true
    code-line-numbers: true
    toc: true
    # `code-overflow: wrap` is deliberately NOT set. measured sizes blocks
    # to 80 characters and scrolls beyond that; wrapping instead would
    # destroy the indentation that shows the shape of a pipeline, which is
    # the thing the style chapter spends its time arguing for.
  # PDF disabled 3 Aug 2026 — see the note on downloads: above. Nothing here
  # is wrong except that Fira Code is not on the GitHub runner. Uncomment as a
  # block to restore.
  # pdf:
  #   documentclass: tufte-book
  #   classoption: [justified, a4paper]
  #   include-in-header: tufte.tex
  #   keep-tex: true
  #   # The default mono font has no box-drawing glyphs, so the file trees
  #   # silently lost every ├── and └── in print, leaving an indented list of
  #   # names with no structure. Fira Code has them, and matches the HTML.
  #   monofont: "Fira Code"
  #   # tufte-book's float machinery cannot handle Quarto's default
  #   # `\begin{figure}[H]` - it fails with "Extra }, or forgotten
  #   # \endgroup" at \end{figure}. Any captioned image triggers it.
  #   fig-pos: 'ht'
