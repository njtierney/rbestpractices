<title id="t">One script, five chunks</title>
<desc id="d">A listing of the education script with each line tinted by the chunk it belongs to, and each chunk named down the right hand side. The five chunks are: attach the packages, read the spreadsheet, prepare the education rows, prepare the population rows, and join then plot. The package colour appears in five separate places down the listing, because the library calls are scattered through the script rather than gathered at the top.</desc>
