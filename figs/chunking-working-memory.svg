<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-labelledby="t d">
<title id="t">Chunking and working memory</title>
<desc id="d">Ten loose digits are ten chunks to remember. The same ten digits grouped as a phone number are three chunks. Code works the same way: a wall of fifty lines is usually four or five ideas written longhand.</desc>
<defs><style>
 .h{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:14px;font-weight:bold}
 .s{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:12.5px;fill:#4a5160}
 .n{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold}
 .m{font-family:"DejaVu Sans Mono",Menlo,monospace;font-size:12.5px;fill:#1b2733}
 .big{font-family:"DejaVu Sans Mono",Menlo,monospace;font-size:28px;fill:#1b2733}
</style>
<marker id="ah-o" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#D95F02"/></marker>
</defs>
<rect width="900" height="700" fill="#fff"/>
<text class="h" x="30" y="44" fill="#1b2733">Ten loose digits</text>
<rect x="30" y="58" width="56" height="66" rx="7" fill="#E7298A" fill-opacity="0.10" stroke="#E7298A" stroke-opacity="0.35"/>
<text class="big" x="58" y="102" text-anchor="middle">1</text>
<rect x="98" y="58" width="56" height="66" rx="7" fill="#E7298A" fill-opacity="0.10" stroke="#E7298A" stroke-opacity="0.35"/>
<text class="big" x="126" y="102" text-anchor="middle">8</text>
<rect x="166" y="58" width="56" height="66" rx="7" fill="#E7298A" fill-opacity="0.10" stroke="#E7298A" stroke-opacity="0.35"/>
<text class="big" x="194" y="102" text-anchor="middle">0</text>
<rect x="234" y="58" width="56" height="66" rx="7" fill="#E7298A" fill-opacity="0.10" stroke="#E7298A" stroke-opacity="0.35"/>
<text class="big" x="262" y="102" text-anchor="middle">0</text>
<rect x="302" y="58" width="56" height="66" rx="7" fill="#E7298A" fill-opacity="0.10" stroke="#E7298A" stroke-opacity="0.35"/>
<text class="big" x="330" y="102" text-anchor="middle">1</text>
<rect x="370" y="58" width="56" height="66" rx="7" fill="#E7298A" fill-opacity="0.10" stroke="#E7298A" stroke-opacity="0.35"/>
<text class="big" x="398" y="102" text-anchor="middle">3</text>
<rect x="438" y="58" width="56" height="66" rx="7" fill="#E7298A" fill-opacity="0.10" stroke="#E7298A" stroke-opacity="0.35"/>
<text class="big" x="466" y="102" text-anchor="middle">1</text>
<rect x="506" y="58" width="56" height="66" rx="7" fill="#E7298A" fill-opacity="0.10" stroke="#E7298A" stroke-opacity="0.35"/>
<text class="big" x="534" y="102" text-anchor="middle">0</text>
<rect x="574" y="58" width="56" height="66" rx="7" fill="#E7298A" fill-opacity="0.10" stroke="#E7298A" stroke-opacity="0.35"/>
<text class="big" x="602" y="102" text-anchor="middle">8</text>
<rect x="642" y="58" width="56" height="66" rx="7" fill="#E7298A" fill-opacity="0.10" stroke="#E7298A" stroke-opacity="0.35"/>
<text class="big" x="670" y="102" text-anchor="middle">6</text>
<rect x="716" y="66" width="154" height="30" rx="15" fill="#E7298A" opacity="0.12"/>
<text class="n" x="793" y="86" text-anchor="middle" fill="#E7298A">10 chunks</text>
<text class="s" x="793" y="112" text-anchor="middle">beyond your limit</text>
<text class="h" x="30" y="170" fill="#1b2733">The same digits, grouped</text>
<rect x="30" y="184" width="140" height="66" rx="7" fill="#1B9E77" fill-opacity="0.10" stroke="#1B9E77" stroke-opacity="0.35"/>
<text class="big" x="100" y="228" text-anchor="middle">1800</text>
<rect x="190" y="184" width="120" height="66" rx="7" fill="#1B9E77" fill-opacity="0.10" stroke="#1B9E77" stroke-opacity="0.35"/>
<text class="big" x="250" y="228" text-anchor="middle">131</text>
<rect x="330" y="184" width="120" height="66" rx="7" fill="#1B9E77" fill-opacity="0.10" stroke="#1B9E77" stroke-opacity="0.35"/>
<text class="big" x="390" y="228" text-anchor="middle">086</text>
<rect x="716" y="192" width="154" height="30" rx="15" fill="#1B9E77" opacity="0.12"/>
<text class="n" x="793" y="212" text-anchor="middle" fill="#1B9E77">3 chunks</text>
<text class="s" x="793" y="238" text-anchor="middle">well within it</text>
<text class="s" x="30" y="286">Nothing about the information changed. Only the chunking did.</text>
<text class="s" x="30" y="308">Working memory holds about seven chunks, plus or minus two. Make the chunks bigger and you hold more.</text>
<line x1="30" y1="342" x2="870" y2="342" stroke="#e6e8eb"/>
<text class="h" x="30" y="376" fill="#1b2733">Code is the same</text>
<text class="h" x="30" y="410" fill="#666666">50 lines</text>
<text class="h" x="470" y="410" fill="#1B9E77">four or five ideas</text>
