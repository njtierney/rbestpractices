<path d="M 372,524 H 458" stroke="#D95F02" stroke-width="2" fill="none" marker-end="url(#ah-o)"/>
<rect x="470" y="424" width="400" height="200" rx="8" fill="#fbfbfb" stroke="#e6e8eb"/>
<rect x="486" y="439" width="368" height="29" rx="6" fill="#1B9E77" opacity="0.12"/>
<text class="n" x="502" y="459" fill="#1B9E77">read the data</text>
<rect x="486" y="474" width="368" height="29" rx="6" fill="#1B9E77" opacity="0.12"/>
<text class="n" x="502" y="494" fill="#1B9E77">clean the names</text>
<rect x="486" y="509" width="368" height="29" rx="6" fill="#1B9E77" opacity="0.12"/>
<text class="n" x="502" y="529" fill="#1B9E77">fit the model</text>
<rect x="486" y="544" width="368" height="29" rx="6" fill="#1B9E77" opacity="0.12"/>
<text class="n" x="502" y="564" fill="#1B9E77">build the table</text>
<rect x="486" y="579" width="368" height="29" rx="6" fill="#1B9E77" opacity="0.12"/>
<text class="n" x="502" y="599" fill="#1B9E77">save the figure</text>
<text class="s" x="30" y="662">Same idea. A wall of code is not fifty separate things to understand.</text>
<text class="s" x="30" y="684">Find the ideas, give each one a name, and you are holding five things instead of fifty.</text>
