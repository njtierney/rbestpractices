<text class="code" x="96" y="66" fill="#1b2733">library(readxl)</text>
<text class="code" x="96" y="100" fill="#1b2733">library(janitor)</text>
<text class="code" x="96" y="168" fill="#1b2733">data &lt;- read_excel(...)</text>
<text class="code" x="96" y="202" fill="#1b2733">the_names &lt;- names(data)</text>
<text class="code" x="96" y="236" fill="#1b2733">the_names[1] &lt;- "state"</text>
<text class="code" x="96" y="304" fill="#1b2733">library(dplyr)</text>
<text class="code" x="96" y="338" fill="#1b2733">library(tidyr)</text>
<text class="code" x="96" y="372" fill="#1b2733">data_studying &lt;- data |&gt;</text>
<text class="code" x="127" y="406" fill="#1b2733">slice(4:11) |&gt;</text>
<text class="code" x="127" y="440" fill="#1b2733">pivot_longer(...)</text>
<text class="code" x="96" y="508" fill="#1b2733">data_population &lt;- data |&gt;</text>
<text class="code" x="127" y="542" fill="#1b2733">slice(24:31) |&gt;</text>
<text class="code" x="127" y="576" fill="#1b2733">pivot_longer(...)</text>
<text class="code" x="96" y="644" fill="#1b2733">library(forcats)</text>
<text class="code" x="96" y="678" fill="#1b2733">data_joined &lt;- ... |&gt;</text>
<text class="code" x="127" y="712" fill="#1b2733">left_join(...)</text>
<text class="code" x="96" y="780" fill="#1b2733">library(ggplot2)</text>
<text class="code" x="96" y="814" fill="#1b2733">ggplot(data_joined, ...)</text>
