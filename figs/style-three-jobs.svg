<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 563" width="900" height="563" role="img" aria-labelledby="t d">
<title id="t">Layout, naming, correctness.</title>
<desc id="d">Three rows. Layout, which is where the spaces and line breaks go, is fixed by a formatter such as air every time you save. Naming, which is what you call your variables and files, has no tool at all: only you can do it, because a name is a decision about meaning. Correctness, whether the code does what you think it does, is flagged by a linter such as jarl. The middle row is the gap the tools cannot fill.</desc>
<defs><style>
 .ttl{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:21px;font-weight:bold;fill:#1b2733}
 .ch{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold;fill:#8b93a1;letter-spacing:0.6px}
 .bn{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:19px;font-weight:bold}
 .s{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:14px;fill:#4a5160}
 .m{font-family:"DejaVu Sans Mono",Menlo,monospace;font-size:15.5px;fill:#1b2733}
 .mb{font-family:"DejaVu Sans Mono",Menlo,monospace;font-size:15.5px;fill:#6f7887}
 .mk{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold}
 .pl{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:16.5px;font-weight:bold}
 .cap{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:14px}
 .ft{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:15px;fill:#4a5160}
</style></defs>
<rect width="900" height="563" fill="#fff"/>
<text class="ttl" x="30" y="42">Layout, naming, correctness.</text>
<text class="ch" x="56" y="76">WHAT IT IS</text>
<text class="ch" x="316" y="76">A SMALL EXAMPLE</text>
<text class="ch" x="756.0" y="76" text-anchor="middle">WHO FIXES IT</text>
<rect x="30" y="92" width="840" height="116" rx="8" fill="#fbfbfb" stroke="#e6e8eb"/>
<path d="M 40,92 H 38 a8,8 0 0 0 -8,8 V 200 a8,8 0 0 0 8,8 H 40 Z" fill="#1B9E77"/>
<text class="bn" x="56" y="130" fill="#1B9E77">Layout</text>
<text class="s" x="56" y="158">Spaces, line breaks.</text>
<text class="s" x="56" y="178"></text>
<text class="mk" x="316" y="140" fill="#E7298A">&#10007;</text>
<text class="mb" x="340" y="140">mean(x,na.rm=TRUE)</text>
<text class="mk" x="316" y="176" fill="#1B9E77">&#10003;</text>
<text class="m" x="340" y="176">mean(x, na.rm = TRUE)</text>
<rect x="652" y="122" width="208" height="36" rx="18" fill="#1B9E77" opacity="0.12"/>
<text class="pl" x="756.0" y="146" text-anchor="middle" fill="#1B9E77">&#10003;&#160;&#160;a formatter</text>
<text class="cap" x="756.0" y="180" text-anchor="middle" fill="#4a5160">fixes it on save</text>
<rect x="30" y="220" width="840" height="116" rx="8" fill="#fffaf3" stroke="#D95F02" stroke-width="1.6"/>
<path d="M 40,220 H 38 a8,8 0 0 0 -8,8 V 328 a8,8 0 0 0 8,8 H 40 Z" fill="#D95F02"/>
<text class="bn" x="56" y="258" fill="#D95F02">Naming</text>
<text class="s" x="56" y="286">Variables, files.</text>
<text class="s" x="56" y="306"></text>
<text class="mk" x="316" y="268" fill="#E7298A">&#10007;</text>
<text class="mb" x="340" y="268">d2</text>
<text class="mk" x="316" y="304" fill="#1B9E77">&#10003;</text>
<text class="m" x="340" y="304">chicks_day_21</text>
<rect x="652" y="250" width="208" height="36" rx="18" fill="none" stroke="#D95F02" stroke-width="1.8" stroke-dasharray="6 4"/>
<text class="pl" x="756.0" y="274" text-anchor="middle" fill="#D95F02">you, by hand</text>
<text class="cap" x="756.0" y="308" text-anchor="middle" font-weight="bold" fill="#D95F02">this one is yours</text>
<rect x="30" y="348" width="840" height="116" rx="8" fill="#fbfbfb" stroke="#e6e8eb"/>
<path d="M 40,348 H 38 a8,8 0 0 0 -8,8 V 456 a8,8 0 0 0 8,8 H 40 Z" fill="#7570B3"/>
<text class="bn" x="56" y="386" fill="#7570B3">Correctness</text>
<text class="s" x="56" y="414">Whether the code does</text>
<text class="s" x="56" y="434">what you think it does.</text>
<text class="mk" x="316" y="396" fill="#E7298A">&#10007;</text>
<text class="mb" x="340" y="396">if (all.equal(x, y))</text>
<text class="mk" x="316" y="432" fill="#1B9E77">&#10003;</text>
<text class="m" x="340" y="432">if (isTRUE(all.equal(x, y)))</text>
<rect x="652" y="378" width="208" height="36" rx="18" fill="#7570B3" opacity="0.12"/>
<text class="pl" x="756.0" y="402" text-anchor="middle" fill="#7570B3">&#10003;&#160;&#160;a linter</text>
<text class="cap" x="756.0" y="436" text-anchor="middle" fill="#4a5160">flags it for you</text>
<line x1="30" y1="490" x2="870" y2="490" stroke="#e6e8eb"/>
<text class="ft" x="30" y="518">A formatter takes the top row and a linter takes the bottom row, both of them for free.</text>
<text class="ft" x="30" y="541">The middle row is the one that needs a person, which is why it is the one worth your attention.</text>
</svg>
