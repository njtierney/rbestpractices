<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 572" width="900" height="572" role="img" aria-labelledby="t d">
<title id="t">Absolute and relative file paths on two different machines</title>
<desc id="d">Two machines hold the same project in different places: yours under /Users/njtierney/Desktop, a colleague&#8217;s under /home/sam/projects. An absolute path that names your machine works on yours and fails on theirs. A relative path, data/penguins.csv, works on both, because it starts from the project rather than the top of the disk.</desc>
<defs><style>
 .h{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:17px;font-weight:bold}
 .s{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:14.5px}
 .m{font-family:"DejaVu Sans Mono",Menlo,monospace;font-size:13px}
 .mm{font-family:"DejaVu Sans Mono",Menlo,monospace;font-size:15.5px}
 .w{font-family:"DejaVu Sans Mono",Menlo,monospace;font-size:12.5px}
 .n{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold}
 .v{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:15.5px;font-weight:bold}
</style></defs>
<rect width="900" height="572" fill="#fff"/>
<text class="h" x="30" y="52" fill="#1b2733">Your machine</text>
<text class="h" x="490" y="52" fill="#1b2733">A colleague's machine</text>
<line x1="220" y1="212" x2="220" y2="516" stroke="#eef0f3" stroke-width="2"/>
<line x1="680" y1="212" x2="680" y2="516" stroke="#eef0f3" stroke-width="2"/>
<rect x="30" y="68" width="380" height="144" rx="8" fill="#f6f8fa" stroke="#dde3e8" stroke-width="1"/>
<text class="mm" x="44" y="96" fill="#4a5160">/Users/njtierney/Desktop/</text>
<text class="mm" x="44" y="120" fill="#4a5160">└─ analysis-2026/</text>
<text class="mm" x="64" y="144" fill="#4a5160">└─ analysis-2026.Rproj</text>
<text class="mm" x="64" y="168" fill="#4a5160">└─ data/</text>
<text class="mm" x="84" y="192" fill="#1B9E77" font-weight="bold">└─ penguins.csv</text>
<rect x="490" y="68" width="380" height="144" rx="8" fill="#f6f8fa" stroke="#dde3e8" stroke-width="1"/>
<text class="mm" x="504" y="96" fill="#4a5160">/home/sam/projects/</text>
<text class="mm" x="504" y="120" fill="#4a5160">└─ analysis-2026/</text>
<text class="mm" x="524" y="144" fill="#4a5160">└─ analysis-2026.Rproj</text>
<text class="mm" x="524" y="168" fill="#4a5160">└─ data/</text>
<text class="mm" x="544" y="192" fill="#1B9E77" font-weight="bold">└─ penguins.csv</text>
<text class="h" x="30" y="250" fill="#1b2733">An absolute path starts at the top of the disk</text>
<rect x="30" y="264" width="840" height="44" rx="6" fill="#fbfbfb" stroke="#e6e8eb" stroke-width="1"/>
<text class="mm" x="46" y="293" fill="#1b2733">read_csv("/Users/njtierney/Desktop/analysis-2026/data/penguins.csv")</text>
<rect x="162" y="322" width="116" height="32" rx="16" fill="#1B9E77" opacity="0.12"/>
<text class="v" x="220" y="344" fill="#1B9E77" text-anchor="middle">✓&#160;works</text>
<rect x="622" y="322" width="116" height="32" rx="16" fill="#E7298A" opacity="0.12"/>
<text class="v" x="680" y="344" fill="#E7298A" text-anchor="middle">✗&#160;fails</text>
<text class="s" x="30" y="382" fill="#4a5160">Their machine has no /Users/njtierney. Nor will yours, once you move that folder.</text>
<text class="h" x="30" y="418" fill="#1b2733">A relative path starts from the project</text>
<rect x="30" y="432" width="840" height="44" rx="6" fill="#fbfbfb" stroke="#e6e8eb" stroke-width="1"/>
<text class="mm" x="46" y="461" fill="#1b2733">read_csv("data/penguins.csv")</text>
<rect x="162" y="490" width="116" height="32" rx="16" fill="#1B9E77" opacity="0.12"/>
<text class="v" x="220" y="512" fill="#1B9E77" text-anchor="middle">✓&#160;works</text>
<rect x="622" y="490" width="116" height="32" rx="16" fill="#1B9E77" opacity="0.12"/>
<text class="v" x="680" y="512" fill="#1B9E77" text-anchor="middle">✓&#160;works</text>
<text class="s" x="30" y="550" fill="#4a5160">Same line of code, both machines. The project decides where “here” is.</text>
</svg>
