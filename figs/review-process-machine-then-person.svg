<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t d">
<title id="t">A five step process for reviewing code</title>
<desc id="d">Step one, running the automated checks, sits in its own band and is done by a machine in seconds. Steps two to five, reading it through, chunking it up, expression and re-expression, sit in a second band and can only be done by a person. The machine reviews the mechanics so the person can review the thinking.</desc>
<defs><style>
 .h{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:14px;font-weight:bold;fill:#1b2733}
 .hh{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:15.5px;font-weight:bold;fill:#1b2733}
 .s{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:12.5px;fill:#4a5160}
 .n{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold}
 .m{font-family:"DejaVu Sans Mono",Menlo,monospace;font-size:12px;fill:#1b2733}
 .num{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:19px;font-weight:bold;fill:#fff}
</style>
<marker id="ah-gr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#666666"/></marker>
</defs>
<rect width="900" height="600" fill="#fff"/>
<text class="hh" x="30" y="42">Let the machine review the mechanics, so that people can review the thinking.</text>
<rect x="30" y="66" width="840" height="126" rx="8" fill="#666666" fill-opacity="0.06" stroke="#e6e8eb"/>
<text class="n" x="850" y="90" text-anchor="end" fill="#666666">done by a machine, in seconds</text>
<circle cx="76" cy="106" r="22" fill="#666666"/>
<text class="num" x="76" y="113" text-anchor="middle">1</text>
<text class="h" x="118" y="102">Run the automated checks first</text>
<text class="s" x="118" y="124">Before anyone reads a line of it.</text>
<rect x="118" y="140" width="114" height="28" rx="6" fill="#666666" opacity="0.13"/>
<text class="m" x="132" y="159">air format .</text>
<rect x="244" y="140" width="114" height="28" rx="6" fill="#666666" opacity="0.13"/>
<text class="m" x="258" y="159">jarl check .</text>
<rect x="370" y="140" width="237" height="28" rx="6" fill="#666666" opacity="0.13"/>
<text class="m" x="384" y="159">spelling::spell_check_files()</text>
<rect x="619" y="140" width="205" height="28" rx="6" fill="#666666" opacity="0.13"/>
<text class="n" x="633" y="158" fill="#4a5160">restart R, run from the top</text>
<path d="M 76,196 V 224" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#ah-gr)"/>
<text class="n" x="96" y="218" fill="#666666">only then is it worth a person’s time</text>
<rect x="30" y="232" width="840" height="282" rx="8" fill="#7570B3" fill-opacity="0.06" stroke="#e6e8eb"/>
<text class="n" x="850" y="256" text-anchor="end" fill="#7570B3">only a person can do these</text>
<line x1="76" y1="290" x2="76" y2="482" stroke="#7570B3" stroke-width="2" opacity="0.30"/>
<circle cx="76" cy="288" r="20" fill="#7570B3"/>
<text class="num" x="76" y="295" text-anchor="middle">2</text>
<text class="h" x="118" y="284">Read it top to bottom, and edit nothing</text>
<text class="s" x="118" y="306">Collect the places where the code caught you. Those moments are the data.</text>
<circle cx="76" cy="352" r="20" fill="#7570B3"/>
<text class="num" x="76" y="359" text-anchor="middle">3</text>
<text class="h" x="118" y="348">Chunk it up</text>
<text class="s" x="118" y="370">Put similar things together, and move a definition next to where it is used.</text>
<circle cx="76" cy="416" r="20" fill="#7570B3"/>
<text class="num" x="76" y="423" text-anchor="middle">4</text>
<text class="h" x="118" y="412">Expression: can you follow it?</text>
<text class="s" x="118" y="434">For each place that caught you, can you say what it is for in a sentence?</text>
<circle cx="76" cy="480" r="20" fill="#7570B3"/>
<text class="num" x="76" y="487" text-anchor="middle">5</text>
<text class="h" x="118" y="476">Re-expression: can you say it more simply?</text>
<text class="s" x="118" y="498">Same output, fewer things to hold in your head. That is refactoring.</text>
<text class="s" x="30" y="548">Step 1 is a button you press. Steps 2 to 5 are the review, and attention spent on spacing is attention gone.</text>
<text class="s" x="30" y="570">All five work on your own code as well as on someone else’s.</text>
</svg>
