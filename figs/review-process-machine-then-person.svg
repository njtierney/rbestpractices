<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" width="940" height="620" role="img" aria-labelledby="t d">
<title id="t">Where the machine helps, and where it cannot</title>
<desc id="d">Three stacked bands. The top grey band is step 1, fix the style, done by a machine in seconds, with air format and styler. The middle purple band holds steps 2 to 6, the ones only a person can do: read it and mark it up, check the names, group like with like, review the comments, and remove the commented-out code. The bottom grey band is step 7, run a linter, done by a machine again, with jarl check and lintr. The linter comes last because it is a final sweep after the code has been moved around.</desc>
<defs><style>
 .code{font-family:"DejaVu Sans Mono",Menlo,Consolas,monospace;font-size:26px}
 .head{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:19px;font-weight:bold}
 .desc{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:16px}
 .pill{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold}
 .lead{fill:none;stroke-width:2.1}
</style>
<marker id="a-name" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#178665"/></marker>
<marker id="a-fn" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#736EB2"/></marker>
<marker id="a-args" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#C25502"/></marker>
<marker id="a-default" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9B6E1B"/></marker>
<marker id="a-body" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#666666"/></marker>
<marker id="a-return" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E0197F"/></marker>
<marker id="a-good" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#178665"/></marker>
<marker id="a-bad" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E0197F"/></marker>
<marker id="a-warn" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#C25502"/></marker>
<marker id="a-muted" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#666666"/></marker>
</defs>
<rect width="940" height="620" fill="#ffffff"/>
<rect x="60" y="40" width="820" height="96" rx="12" fill="#f4f5f6" stroke="#e6e8eb"/>
<text class="head" x="86" y="78" fill="#666666">1. Fix the style</text>
<text class="desc" x="86" y="102" fill="#4a5160">A machine, in seconds.</text>
<rect x="530" y="58" width="126.8" height="26" rx="13" fill="#666666" opacity="0.12"/>
<text class="pill" x="593.4" y="76" text-anchor="middle" fill="#666666">air format .</text>
<rect x="700" y="58" width="76.4" height="26" rx="13" fill="#666666" opacity="0.12"/>
<text class="pill" x="738.2" y="76" text-anchor="middle" fill="#666666">styler</text>
<path class="lead" stroke="#666666" marker-end="url(#a-muted)" d="M 120,140 L 120,176"/>
<rect x="60" y="180" width="820" height="300" rx="12" fill="#f7f6fb" stroke="#e3e0ef"/>
<text class="head" x="86" y="216" fill="#736EB2">Only a person can do these</text>
<text class="head" x="100" y="258" fill="#666666">2. Read it top to bottom, and mark it up</text>
<text class="head" x="100" y="302" fill="#666666">3. Check the names</text>
<text class="head" x="100" y="346" fill="#666666">4. Group the similar parts together</text>
<text class="head" x="100" y="390" fill="#666666">5. Review the comments</text>
<text class="head" x="100" y="434" fill="#666666">6. Remove the wilted lettuce</text>
<path class="lead" stroke="#666666" marker-end="url(#a-muted)" d="M 120,484 L 120,520"/>
<rect x="60" y="524" width="820" height="96" rx="12" fill="#f4f5f6" stroke="#e6e8eb"/>
<text class="head" x="86" y="562" fill="#666666">7. Run a linter</text>
<text class="desc" x="86" y="586" fill="#4a5160">A machine again, once you have finished moving things.</text>
<rect x="530" y="542" width="126.8" height="26" rx="13" fill="#666666" opacity="0.12"/>
<text class="pill" x="593.4" y="560" text-anchor="middle" fill="#666666">jarl check .</text>
<rect x="700" y="542" width="68" height="26" rx="13" fill="#666666" opacity="0.12"/>
<text class="pill" x="734" y="560" text-anchor="middle" fill="#666666">lintr</text>
</svg>
