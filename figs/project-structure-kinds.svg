<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 778" width="780" height="778" role="img" aria-labelledby="t d">
<title id="t">A project folder structure, colour-coded by what each thing is</title>
<desc id="d">The folders of a project called my-project, grouped into six kinds of thing, each on its own row with a coloured bar and a label. The .Rproj file and README.md are labelled start here. data-raw, holding penguins-raw.csv and clean-penguins.R, is labelled read only: never edited by hand, nothing writes there. data, holding penguins.csv, is labelled made by code, because clean-penguins.R writes it. R, holding functions.R, is labelled used, not run. analysis, holding 01-clean-data.R, 02-fit-model.R and 03-make-figures.R, is labelled run in order, with an arrow down the three numbered scripts. output, holding figures and models, is labelled safe to delete. The test underneath: could I delete this folder and get it back by running my code? Yes for data and output, no for data-raw, which is the folder to back up.</desc>
<defs><style>
 .h{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:14px;font-weight:bold;fill:#1b2733}
 .s{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:12.5px;fill:#4a5160}
 .m{font-family:"DejaVu Sans Mono",Menlo,monospace;font-size:12.5px;fill:#4a5160}
 .mb{font-family:"DejaVu Sans Mono",Menlo,monospace;font-size:13px;font-weight:bold}
 .v{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold}
</style></defs>
<marker id="ah-o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#D95F02"/></marker>
<rect width="780" height="778" fill="#fff"/>
<text class="h" x="30" y="46">What kind of thing is this?</text>
<text class="s" x="30" y="72">The folder names matter less than the kinds of thing they hold. Each row is one kind.</text>
<text class="mb" x="30" y="112" fill="#1b2733">my-project/</text>
<rect x="30" y="132" width="720" height="66" rx="8" fill="#fbfbfb" stroke="#e6e8eb"/>
<rect x="30" y="132" width="10" height="66" rx="5" fill="#1b2733"/>
<text class="mb" x="60" y="160" fill="#1b2733">my-project.Rproj</text>
<text class="mb" x="60" y="182" fill="#1b2733">README.md</text>
<rect x="330" y="146" width="106" height="28" rx="14" fill="#1b2733" opacity="0.14"/>
<text class="v" x="383" y="165" text-anchor="middle" fill="#1b2733">start here</text>
<text class="s" x="330" y="194">Open the .Rproj. Read the README.</text>
<rect x="30" y="210" width="720" height="88" rx="8" fill="#fbfbfb" stroke="#e6e8eb"/>
<rect x="30" y="210" width="10" height="88" rx="5" fill="#E7298A"/>
<text class="mb" x="60" y="238" fill="#E7298A">data-raw/</text>
<text class="m" x="82" y="260">└─ penguins-raw.csv</text>
<text class="m" x="82" y="282">└─ clean-penguins.R</text>
<rect x="330" y="224" width="98" height="28" rx="14" fill="#E7298A" opacity="0.14"/>
<text class="v" x="379" y="243" text-anchor="middle" fill="#E7298A">read only</text>
<text class="s" x="330" y="272">Never edited by hand. Nothing writes here.</text>
<rect x="30" y="310" width="720" height="66" rx="8" fill="#fbfbfb" stroke="#e6e8eb"/>
<rect x="30" y="310" width="10" height="66" rx="5" fill="#7570B3"/>
<text class="mb" x="60" y="338" fill="#7570B3">data/</text>
<text class="m" x="82" y="360">└─ penguins.csv</text>
<rect x="330" y="324" width="121" height="28" rx="14" fill="#7570B3" opacity="0.14"/>
<text class="v" x="390" y="343" text-anchor="middle" fill="#7570B3">made by code</text>
<text class="s" x="330" y="372">Written by data-raw/clean-penguins.R.</text>
<rect x="30" y="388" width="720" height="66" rx="8" fill="#fbfbfb" stroke="#e6e8eb"/>
<rect x="30" y="388" width="10" height="66" rx="5" fill="#1B9E77"/>
<text class="mb" x="60" y="416" fill="#1B9E77">R/</text>
<text class="m" x="82" y="438">└─ functions.R</text>
<rect x="330" y="402" width="129" height="28" rx="14" fill="#1B9E77" opacity="0.14"/>
<text class="v" x="394" y="421" text-anchor="middle" fill="#1B9E77">used, not run</text>
<text class="s" x="330" y="450">Functions you call from the scripts below.</text>
<rect x="30" y="466" width="720" height="110" rx="8" fill="#fbfbfb" stroke="#e6e8eb"/>
<rect x="30" y="466" width="10" height="110" rx="5" fill="#D95F02"/>
<text class="mb" x="60" y="494" fill="#D95F02">analysis/</text>
<text class="m" x="82" y="516">└─ 01-clean-data.R</text>
<text class="m" x="82" y="538">└─ 02-fit-model.R</text>
<text class="m" x="82" y="560">└─ 03-make-figures.R</text>
<path d="M 70,504 V 558" stroke="#D95F02" stroke-width="2" fill="none" marker-end="url(#ah-o)"/>
<rect x="330" y="480" width="121" height="28" rx="14" fill="#D95F02" opacity="0.14"/>
<text class="v" x="390" y="499" text-anchor="middle" fill="#D95F02">run in order</text>
<text class="s" x="330" y="528">The numbers are the entry point.</text>
<rect x="30" y="588" width="720" height="88" rx="8" fill="#fbfbfb" stroke="#e6e8eb"/>
<rect x="30" y="588" width="10" height="88" rx="5" fill="#666666"/>
<text class="mb" x="60" y="616" fill="#666666">output/</text>
<text class="m" x="82" y="638">└─ figures/</text>
<text class="m" x="82" y="660">└─ models/</text>
<rect x="330" y="602" width="136" height="28" rx="14" fill="#666666" opacity="0.14"/>
<text class="v" x="398" y="621" text-anchor="middle" fill="#666666">safe to delete</text>
<text class="s" x="330" y="650">Regenerated by re-running analysis/.</text>
<line x1="30" y1="704" x2="750" y2="704" stroke="#e6e8eb"/>
<text class="h" x="30" y="736">The test: could I delete this folder and get it back by running my code?</text>
<text class="s" x="30" y="760">Yes for data/ and output/. No for data-raw/ &#8212; which is why that is the folder you back up.</text>
</svg>