<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476" width="900" height="476" role="img" aria-labelledby="t d">
<title id="t">The inputs and outputs of a chunk of code</title>
<desc id="d">Two chunks compared by what goes in and what comes out. The first needs six objects made in four different places and leaves nine behind, only two of which are used again. The second needs one object and leaves one, so it can be lifted out and named.</desc>
<defs><style>
 .h{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:14px;font-weight:bold}
 .s{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:12.5px;fill:#4a5160}
 .n{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold}
 .m{font-family:"DejaVu Sans Mono",Menlo,monospace;font-size:12px}
</style>
<marker id="ah-m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E7298A"/></marker>
<marker id="ah-o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#D95F02"/></marker>
<marker id="ah-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1B9E77"/></marker>
</defs>
<rect width="900" height="476" fill="#fff"/>
<text class="h" x="30" y="42" fill="#1b2733">What does this chunk need to run, and what does it leave behind?</text>
<text class="h" x="30" y="82" fill="#E7298A">Six things in, nine things out</text>
<rect x="30" y="100" width="112" height="30" rx="6" fill="#fbfbfb" stroke="#e6e8eb"/>
<text class="m" x="46" y="120" fill="#4a5160">line 12</text>
<rect x="30" y="140" width="112" height="30" rx="6" fill="#fbfbfb" stroke="#e6e8eb"/>
<text class="m" x="46" y="160" fill="#4a5160">line 40</text>
<rect x="30" y="180" width="112" height="30" rx="6" fill="#fbfbfb" stroke="#e6e8eb"/>
<text class="m" x="46" y="200" fill="#4a5160">line 88</text>
<rect x="30" y="220" width="112" height="30" rx="6" fill="#fbfbfb" stroke="#e6e8eb"/>
<text class="m" x="46" y="240" fill="#4a5160">line 130</text>
<text class="s" x="30" y="268">made in four different places</text>
<rect x="330" y="100" width="230" height="150" rx="8" fill="#fbfbfb" stroke="#e6e8eb"/>
<text class="h" x="445" y="168" text-anchor="middle" fill="#1b2733">one chunk</text>
<text class="s" x="445" y="190" text-anchor="middle">lines 84 to 150</text>
<path d="M 148,115 C 220,115 250,112 324,112" stroke="#E7298A" stroke-width="2" fill="none" opacity="0.85" marker-end="url(#ah-m)"/>
<path d="M 148,115 C 220,115 250,130 324,130" stroke="#E7298A" stroke-width="2" fill="none" opacity="0.85" marker-end="url(#ah-m)"/>
<path d="M 148,155 C 220,155 250,148 324,148" stroke="#E7298A" stroke-width="2" fill="none" opacity="0.85" marker-end="url(#ah-m)"/>
<path d="M 148,195 C 220,195 250,166 324,166" stroke="#E7298A" stroke-width="2" fill="none" opacity="0.85" marker-end="url(#ah-m)"/>
<path d="M 148,195 C 220,195 250,184 324,184" stroke="#E7298A" stroke-width="2" fill="none" opacity="0.85" marker-end="url(#ah-m)"/>
<path d="M 148,235 C 220,235 250,202 324,202" stroke="#E7298A" stroke-width="2" fill="none" opacity="0.85" marker-end="url(#ah-m)"/>
<path d="M 564,112 C 620,112 640,104 700,104" stroke="#1B9E77" stroke-width="2" fill="none" marker-end="url(#ah-g)"/>
<path d="M 564,126 C 620,126 640,120 700,120" stroke="#1B9E77" stroke-width="2" fill="none" marker-end="url(#ah-g)"/>
<path d="M 564,140 H 684" stroke="#D95F02" stroke-width="2" fill="none" opacity="0.85" marker-end="url(#ah-o)"/>
<path d="M 564,154 H 684" stroke="#D95F02" stroke-width="2" fill="none" opacity="0.85" marker-end="url(#ah-o)"/>
<path d="M 564,168 H 684" stroke="#D95F02" stroke-width="2" fill="none" opacity="0.85" marker-end="url(#ah-o)"/>
<path d="M 564,182 H 684" stroke="#D95F02" stroke-width="2" fill="none" opacity="0.85" marker-end="url(#ah-o)"/>
<path d="M 564,196 H 684" stroke="#D95F02" stroke-width="2" fill="none" opacity="0.85" marker-end="url(#ah-o)"/>
<path d="M 564,210 H 684" stroke="#D95F02" stroke-width="2" fill="none" opacity="0.85" marker-end="url(#ah-o)"/>
<path d="M 564,224 H 684" stroke="#D95F02" stroke-width="2" fill="none" opacity="0.85" marker-end="url(#ah-o)"/>
<rect x="706" y="92" width="160" height="40" rx="8" fill="#1B9E77" opacity="0.12"/>
<text class="n" x="786" y="117" text-anchor="middle" fill="#1B9E77">used later</text>
<line x1="690" y1="134" x2="690" y2="232" stroke="#D95F02" stroke-width="2" stroke-dasharray="5 5"/>
<text class="n" x="706" y="178" fill="#D95F02">never used</text>
<text class="n" x="706" y="196" fill="#D95F02">again</text>
<text class="s" x="30" y="296">Seven of the nine outputs go nowhere. You cannot move this chunk, cannot test it, and cannot read it on its own.</text>
<line x1="30" y1="326" x2="870" y2="326" stroke="#e6e8eb"/>
<text class="h" x="30" y="360" fill="#1B9E77">One thing in, one thing out</text>
<rect x="30" y="378" width="140" height="34" rx="6" fill="#fbfbfb" stroke="#e6e8eb"/>
<text class="m" x="46" y="400" fill="#1b2733">survey_2024</text>
<rect x="330" y="364" width="230" height="62" rx="8" fill="#fbfbfb" stroke="#e6e8eb"/>
<text class="h" x="445" y="390" text-anchor="middle" fill="#1b2733">one chunk</text>
<text class="s" x="445" y="410" text-anchor="middle">keep the north site</text>
<rect x="706" y="378" width="160" height="34" rx="6" fill="#fbfbfb" stroke="#e6e8eb"/>
<text class="m" x="722" y="400" fill="#1b2733">survey_north</text>
<path d="M 176,395 H 324" stroke="#1B9E77" stroke-width="2" fill="none" marker-end="url(#ah-g)"/>
<path d="M 564,395 H 700" stroke="#1B9E77" stroke-width="2" fill="none" marker-end="url(#ah-g)"/>
<text class="s" x="30" y="456">You can lift this one out, give it a name, and test it. It is a function waiting to happen.</text>
</svg>
